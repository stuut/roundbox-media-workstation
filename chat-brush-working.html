<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Brush with single-pass opacity (buffered stroke)</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; background:#fff; }
  #toolbar { position:fixed; top:10px; left:10px; background:#fff; padding:8px; border-radius:8px; z-index:50; }
  canvas { position:absolute; left:0; top:0; }
</style>
</head>
<body>
<div id="toolbar">
  Size <input id="size" type="range" min="10" max="300" value="80"><br>
  Hardness <input id="hard" type="range" min="0" max="100" step="1" value="50"><br>
  Opacity <input id="opacity" type="range" min="0.01" max="1" step="0.01" value="0.5">
</div>

<canvas id="main"></canvas>
<canvas id="overlay"></canvas>

<script>
/* ---------- Setup canvases ---------- */
const main = document.getElementById('main');
const overlay = document.getElementById('overlay');

function resizeAll() {
  const w = window.innerWidth, h = window.innerHeight;
  main.width = overlay.width = w;
  main.height = overlay.height = h;

  // recreate buffer to match size

  buffer.width = w;
  buffer.height = h;
}
window.addEventListener('resize', resizeAll);

// main contexts
const mainCtx = main.getContext('2d');
const overlayCtx = overlay.getContext('2d');

// buffer canvas (offscreen) where we accumulate stamps for the current stroke
const buffer = document.createElement('canvas');
const bufferCtx = buffer.getContext('2d');

resizeAll();

/* ---------- Brush state ---------- */
let brushSize = 80;            // diameter in px
let brushHardness = 50;        // 0..100 (0 soft, 100 hard)
let brushOpacity = 0.5;        // 0..1 - desired single-pass opacity
let painting = false;
let lastX = 0, lastY = 0;

// UI bindings
document.getElementById('size').addEventListener('input', e => {
  brushSize = +e.target.value;
  brushTexture = createBrushTexture(); // recreate texture
});
document.getElementById('hard').addEventListener('input', e => {
  brushHardness = +e.target.value;
  brushTexture = createBrushTexture();
});
document.getElementById('opacity').addEventListener('input', e => brushOpacity = +e.target.value);

/* ---------- Brush texture (center opaque, edges fall to 0) ---------- */
function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

function createBrushTexture() {
  // brushColor fixed to black here; change if you need color
  const brushColor = '#000000';
  const diameter = Math.max(brushSize * 2, 64);
  const canv = document.createElement('canvas');
  canv.width = canv.height = diameter;
  const gctx = canv.getContext('2d');

  const cx = diameter / 2;
  const cy = diameter / 2;
  const R = brushSize; // use brushSize as radius for consistent visual size

  // hardness 0..1 (0 soft, 1 hard)
  const hard = Math.max(0, Math.min(1, brushHardness / 100));

  // convert color
  const r = parseInt(brushColor.slice(1,3),16);
  const g = parseInt(brushColor.slice(3,5),16);
  const b = parseInt(brushColor.slice(5,7),16);

  if (hard >= 0.999) {
    // fully hard: draw a crisp circle mask with alpha = 1 in center -> we will apply globalAlpha once at composition
    gctx.fillStyle = `rgba(${r},${g},${b},1)`;
    gctx.beginPath();
    gctx.arc(cx, cy, R, 0, Math.PI*2);
    gctx.closePath();
    gctx.fill();
  } else {
    // soft: radial gradient from alpha=1 at center to alpha=0 at edge
    // inner radius where alpha stays 1
    const innerR = R * hard;
    const grad = gctx.createRadialGradient(cx, cy, innerR, cx, cy, R);
    // We'll use a smooth falloff using eased stops
    const steps = 128;
    for (let i=0;i<=steps;i++){
      const t = i/steps;
      // t goes 0..1 across radius; easedAlpha goes from 1 down to 0
      const eased = 1 - easeInOut(t);
      const alpha = eased; // we keep center at 1 and edge at 0
      grad.addColorStop(t, `rgba(${r},${g},${b},${alpha})`);
    }
    gctx.fillStyle = grad;
    gctx.fillRect(0,0,diameter,diameter);
  }

  return canv;
}

let brushTexture = createBrushTexture();

/* ---------- Input handling & drawing logic ---------- */

// Use overlay canvas to capture pointer events so main retains previous strokes
overlay.style.zIndex = 40;
main.style.zIndex = 10;

// pointer events
overlay.addEventListener('pointerdown', e => {
  painting = true;
  lastX = e.offsetX;
  lastY = e.offsetY;

  // clear buffer for new stroke
  bufferCtx.clearRect(0,0,buffer.width,buffer.height);

  // draw first stamp into buffer (full alpha inside texture)
  stampToBuffer(lastX, lastY);
  // render overlay: buffer composited once with brushOpacity
  renderOverlay();
});

overlay.addEventListener('pointermove', e => {
  if (!painting) return;
  const x = e.offsetX, y = e.offsetY;
  drawLineBuffer(lastX, lastY, x, y);
  lastX = x; lastY = y;
  renderOverlay();
});

overlay.addEventListener('pointerup', e => {
  if (!painting) return;
  painting = false;
  // finalize: composite buffer once onto main with globalAlpha = brushOpacity
  mainCtx.globalAlpha = brushOpacity;
  mainCtx.drawImage(buffer, 0, 0);
  mainCtx.globalAlpha = 1;
  // clear overlay and buffer for next stroke
  overlayCtx.clearRect(0,0,overlay.width,overlay.height);
  bufferCtx.clearRect(0,0,buffer.width,buffer.height);
});

overlay.addEventListener('pointerout', () => {
  if(painting) {
    // treat as pointerup for safety
    painting = false;
    mainCtx.globalAlpha = brushOpacity;
    mainCtx.drawImage(buffer, 0, 0);
    mainCtx.globalAlpha = 1;
    overlayCtx.clearRect(0,0,overlay.width,overlay.height);
    bufferCtx.clearRect(0,0,buffer.width,buffer.height);
  }
});

/* ---------- Helpers ---------- */

function stampToBuffer(x, y) {
  // Draw brush texture onto the buffer. NOTE: draw with full alpha (we rely on buffer being composited once)
  const d = brushTexture.width;
  bufferCtx.drawImage(brushTexture, x - d/2, y - d/2);
}

function drawLineBuffer(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.hypot(dx,dy);
  // spacing depends on hardness: tighter spacing for harder brushes to avoid banding
  const hardnessFactor = Math.max(0.01, brushHardness / 100); // 0.01..1
  const spacing = Math.max(1, (brushSize * (0.25 - 0.2 * hardnessFactor)));
  const steps = Math.ceil(dist / spacing);
  for (let i=0;i<=steps;i++){
    const t = steps === 0 ? 0 : i/steps;
    const x = x1 + dx*t;
    const y = y1 + dy*t;
    stampToBuffer(x, y);
  }
}

function renderOverlay() {
  // Clear overlay and draw buffer onto it once with globalAlpha = brushOpacity
  overlayCtx.clearRect(0,0,overlay.width,overlay.height);
  overlayCtx.globalAlpha = brushOpacity;
  overlayCtx.drawImage(buffer, 0, 0);
  overlayCtx.globalAlpha = 1;
}

/* create initial brushTexture dimensions match radius used above */
buffer.width = main.width;
buffer.height = main.height;
brushTexture = createBrushTexture();

</script>
</body>
</html>
