<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Edge Brush Tool</title>

</head>
<style>
body{
  background-color: #e3e3e3
}
</style>
<body>
  <button id="editBtn">Edit Image</button>
<div id="editDialog" style="display:none; position:relative;">
  <canvas id="editCanvas"></canvas>
  <canvas id="maskCanvas" style="position:absolute; left:0; top:0;"></canvas>
  <button id="expandBtn">Expand Canvas</button>
  <button id="sendAPI">Send to AI</button>
</div>


    <script>
    const OPENAI_API_KEY = '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'
    // JavaScript
    const editBtn = document.getElementById('editBtn');
    const dialog = document.getElementById('editDialog');
    const canvas = document.getElementById('editCanvas');
    const maskCanvas = document.getElementById('maskCanvas');
    const ctx = canvas.getContext('2d');
    const maskCtx = maskCanvas.getContext('2d');

    let drawing = false;
    let lastX = 0, lastY = 0;

    // Mock: load original image
    const originalImage = new Image();
    originalImage.crossOrigin = "anonymous"; // Must be set before src
    originalImage.src = '/your-image.png'; // relative path from server root
    originalImage.onload = () => {
      canvas.width = originalImage.width;
      canvas.height = originalImage.height;
      maskCanvas.width = originalImage.width;
      maskCanvas.height = originalImage.height;
      ctx.drawImage(originalImage, 0, 0);
    };

    // Open dialog
    editBtn.addEventListener('click', () => {
      dialog.style.display = 'block';
      // Clear mask for new edit
      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
    });

    // Draw mask on maskCanvas
    maskCanvas.addEventListener('mousedown', e => { drawing = true; [lastX, lastY] = [e.offsetX, e.offsetY]; });
    maskCanvas.addEventListener('mouseup', () => drawing = false);
    maskCanvas.addEventListener('mouseout', () => drawing = false);
    maskCanvas.addEventListener('mousemove', e => {
      if(!drawing) return;
      maskCtx.strokeStyle = 'rgba(0,0,0,1)'; // black = preserve, transparent = fill
      maskCtx.lineWidth = 20;
      maskCtx.lineCap = 'round';
      maskCtx.beginPath();
      maskCtx.moveTo(lastX, lastY);
      maskCtx.lineTo(e.offsetX, e.offsetY);
      maskCtx.stroke();
      [lastX, lastY] = [e.offsetX, e.offsetY];
    });

    // Expand canvas
    document.getElementById('expandBtn').addEventListener('click', () => {
      const extraWidth = 200; // example: expand right
      const extraHeight = 0;  // you could expand top/bottom too

      const newCanvas = document.createElement('canvas');
      newCanvas.width = canvas.width + extraWidth;
      newCanvas.height = canvas.height + extraHeight;
      const newCtx = newCanvas.getContext('2d');

      // Draw old image on new canvas
      newCtx.drawImage(canvas, 0, 0);

      // Resize existing canvases
      canvas.width = newCanvas.width;
      canvas.height = newCanvas.height;
      maskCanvas.width = newCanvas.width;
      maskCanvas.height = newCanvas.height;
      ctx.drawImage(newCanvas, 0, 0);

      // Optional: leave new area transparent on mask for AI fill
      maskCtx.clearRect(canvas.width - extraWidth, 0, extraWidth, canvas.height);
    });

    // Prepare data and send to OpenAI
    document.getElementById('sendAPI').addEventListener('click', async () => {

console.log('sendAPI')


      canvas.toBlob(async (imageBlob) => {
        maskCanvas.toBlob(async (maskBlob) => {

          const formData = new FormData();
          formData.append('model', 'gpt-image-1'); // ← REQUIRED
          formData.append('image', imageBlob, 'original.png');
          formData.append('mask', maskBlob, 'mask.png');
          formData.append('prompt', 'Fill the selected area with realistic content');

          for (let pair of formData.entries()) {
  console.log(pair[0], pair[1]);
}

return

          const response = await fetch('https://api.openai.com/v1/images/edits', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${OPENAI_API_KEY}`,
            },
            body: formData
          });

          const data = await response.json();
          const editedURL = data.data[0].url;

          const img = new Image();
          img.onload = () => ctx.drawImage(img, 0, 0);
          img.src = editedURL;
        });
      });
    });
    </script>
</body>
</html>
