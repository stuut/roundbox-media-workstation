<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Edge Brush Tool</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }

        // Create brush texture once and reuse it
        let brushTexture = null;

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .controls {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100px;
        }

        input[type="color"] {
            width: 40px;
            height: 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button {
            padding: 8px 16px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #005a99;
        }

        #canvas {
            border: 2px solid #ddd;
            cursor: crosshair;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Soft Edge Brush</h1>

        <div class="controls">
            <div class="control">
                <label>Size:</label>
                <input type="range" id="size" min="5" max="100" value="30">
                <span id="sizeDisplay">30</span>
            </div>

            <div class="control">
                <label>Opacity:</label>
                <input type="range" id="opacity" min="1" max="100" value="15">
                <span id="opacityDisplay">15%</span>
            </div>

            <div class="control">
                <label>Hardness:</label>
                <input type="range" id="hardness" min="0" max="100" value="0">
                <span id="hardnessDisplay">0%</span>
            </div>

            <div class="control">
                <label>Flow:</label>
                <input type="range" id="flow" min="1" max="100" value="25">
                <span id="flowDisplay">25%</span>
            </div>

            <div class="control">
                <label>Color:</label>
                <input type="color" id="color" value="#000000">
            </div>

            <div class="control">
                <label>
                    <input type="checkbox" id="buildOpacity" checked>
                    Build Opacity
                </label>
            </div>

            <button onclick="clearCanvas()">Clear</button>
            <button onclick="undoClear()" id="undoBtn" disabled>Undo Clear</button>
        </div>

        <canvas id="canvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let isDrawing = false;
        let brushSize = 30;
        let brushOpacity = 15;
        let brushHardness = 0;
        let brushFlow = 25;
        let brushColor = '#000000';
        let buildOpacity = true;
        let lastX = 0;
        let lastY = 0;

        // Canvas state storage
        let canvasHistory = [];
        let maxHistoryStates = 10;

        // Easing function for smoother gradients
        function easeInOut(t) {
            return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        }

        function saveCanvasState() {
            // Save current canvas state
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            canvasHistory.push(imageData);

            // Keep only the last maxHistoryStates
            if (canvasHistory.length > maxHistoryStates) {
                canvasHistory.shift();
            }

            // Enable undo button if we have states
            document.getElementById('undoBtn').disabled = canvasHistory.length === 0;
        }

        function restoreCanvasState() {
            if (canvasHistory.length > 0) {
                const imageData = canvasHistory.pop();
                ctx.putImageData(imageData, 0, 0);

                // Disable undo button if no more states
                document.getElementById('undoBtn').disabled = canvasHistory.length === 0;
            }
        }

        function createBrushTexture() {
            const size = Math.max(brushSize * 2, 100);
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = size;
            tempCanvas.height = size;
            const tempCtx = tempCanvas.getContext('2d');

            const centerX = size / 2;
            const centerY = size / 2;
            const radius = brushSize / 2;

            // Create radial gradient
            const gradient = tempCtx.createRadialGradient(
                centerX, centerY, radius * (brushHardness / 100),
                centerX, centerY, radius
            );

            // Convert hex to rgb
            const r = parseInt(brushColor.slice(1, 3), 16);
            const g = parseInt(brushColor.slice(3, 5), 16);
            const b = parseInt(brushColor.slice(5, 7), 16);
            const alpha = (brushOpacity * brushFlow) / 10000; // Combined opacity and flow

            // Add multiple color stops for smoother gradient (reduces banding)
            const steps = 500;
            for (let i = 0; i <= steps; i++) {
                const stop = i / steps;
                // Use easeInOut for even smoother falloff
                const easedAlpha = alpha * (1 - easeInOut(stop));
                gradient.addColorStop(stop, `rgba(${r}, ${g}, ${b}, ${easedAlpha})`);
            }


            /*
            // Add multiple color stops for smoother gradient (reduces banding)
             const steps = 20;
             for (let i = 0; i <= steps; i++) {
                 const stop = i / steps;
                 // Smooth falloff using ease-out curve
                 const easeStop = 1 - Math.pow(1 - stop, 2);
                 const stopAlpha = alpha * (1 - easeStop);
                 gradient.addColorStop(stop, `rgba(${r}, ${g}, ${b}, ${stopAlpha})`);
             }*/






            //tempCtx.filter = "blur(25px)"
            tempCtx.fillStyle = gradient;
            tempCtx.fillRect(0, 0, size, size);

            return tempCanvas;
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function drawBrushStroke(x, y) {
            if (!brushTexture) {
                brushTexture = createBrushTexture();
            }

            // Set composite operation based on build opacity setting
            if (buildOpacity) {
                ctx.globalCompositeOperation = 'source-over';
            } else {
                ctx.globalCompositeOperation = 'lighten';
            }

            const size = Math.max(brushSize * 2, 100);
            ctx.drawImage(
                brushTexture,
                x - size / 2,
                y - size / 2
            );

            // Reset to default
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawSmoothLine(x0, y0, x1, y1) {
            const distance = Math.sqrt((x1 - x0) ** 2 + (y1 - y0) ** 2);
            // Tighter spacing based on flow - lower flow = more spacing needed for smoothness
            const spacing = Math.max(0.5, (brushSize * 0.02) * (100 / brushFlow));
            const steps = Math.ceil(distance / spacing);

            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const x = x0 + (x1 - x0) * t;
                const y = y0 + (y1 - y0) * t;
                drawBrushStroke(x, y);
            }
        }

        // Mouse events
        canvas.addEventListener('mousedown', (e) => {
            // Save state before starting to draw
            saveCanvasState();

            isDrawing = true;
            const pos = getMousePos(e);
            lastX = pos.x;
            lastY = pos.y;

            // Recreate brush texture with current settings
            brushTexture = createBrushTexture();
            // Only draw initial stroke, don't double up
            drawBrushStroke(pos.x, pos.y);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;

            const pos = getMousePos(e);

            // Only draw line if we've actually moved
            const distance = Math.sqrt((pos.x - lastX) ** 2 + (pos.y - lastY) ** 2);
            if (distance > 0.1) {
                // Skip the first point to avoid double-stamping
                const spacing = Math.max(0.5, (brushSize * 0.02) * (100 / brushFlow));
                const steps = Math.ceil(distance / spacing);

                for (let i = 1; i <= steps; i++) {
                    const t = i / steps;
                    const x = lastX + (pos.x - lastX) * t;
                    const y = lastY + (pos.y - lastY) * t;
                    drawBrushStroke(x, y);
                }

                lastX = pos.x;
                lastY = pos.y;
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        canvas.addEventListener('mouseout', () => {
            isDrawing = false;
        });

        // Update brush texture when settings change
        function updateBrushSettings() {
            brushTexture = null; // Force recreation on next stroke
        }

        // Control updates
        document.getElementById('size').addEventListener('input', (e) => {
            brushSize = parseInt(e.target.value);
            document.getElementById('sizeDisplay').textContent = brushSize;
            updateBrushSettings();
        });

        document.getElementById('opacity').addEventListener('input', (e) => {
            brushOpacity = parseInt(e.target.value);
            document.getElementById('opacityDisplay').textContent = e.target.value + '%';
            updateBrushSettings();
        });

        document.getElementById('hardness').addEventListener('input', (e) => {
            brushHardness = parseInt(e.target.value);
            document.getElementById('hardnessDisplay').textContent = e.target.value + '%';
            updateBrushSettings();
        });

        document.getElementById('flow').addEventListener('input', (e) => {
            brushFlow = parseInt(e.target.value);
            document.getElementById('flowDisplay').textContent = e.target.value + '%';
            updateBrushSettings();
        });

        document.getElementById('color').addEventListener('input', (e) => {
            brushColor = e.target.value;
            updateBrushSettings();
        });

        document.getElementById('buildOpacity').addEventListener('change', (e) => {
            buildOpacity = e.target.checked;
        });

        function clearCanvas() {
            // Save current state before clearing
            saveCanvasState();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function undoClear() {
            restoreCanvasState();
        }
    </script>
</body>
</html>
